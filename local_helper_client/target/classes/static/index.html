<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Helper - 你的本地AI助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="icon" type="imgs/x-icon" href="imgs/favicon.ico">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/settings.css">
</head>
<body>
<!-- 侧边栏 -->
<div class="sidebar-container" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">
            <h1>会话历史</h1>
            <button class="new-conversation-btn" id="newChatBtn">
                <i class="fas fa-plus-circle"></i>
            </button>
        </div>
        <div class="divider"></div>
        <div class="history-list" id="historyList"></div>
        <div class="sidebar-footer">
            <div class="footer-divider"></div>
            <div class="user-info">
                <div class="user-avatar">U</div>
                <div>用户：LocalUser</div>
            </div>
            <button class="settings-btn">
                <i class="fas fa-cog fa-lg"></i>
            </button>
            <!-- 新增设置弹窗 -->
            <div class="settings-modal" id="settingsModal">
                <div class="settings-content">
                    <div class="settings-sidebar">
                        <div class="settings-categories" id="settingsCategories">
                            <!-- 分类将通过JavaScript动态添加 -->
                        </div>
                        <div class="sidebar-divider"></div>
                    </div>
                    <div class="settings-main">
                        <div class="settings-body" id="settingsBody">
                            <!-- 设置项将在此动态添加 -->
                        </div>
                        <div class="settings-footer">
                            <button class="btn-save">保存设置</button>
                            <button class="btn-close">取消</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- 主界面结构 -->
<div class="chat-container">
    <div class="chat-header">
        <h1>AI助手</h1>
        <div class="model-selector">
            <div class="model-name" id="modelName">无模型</div>
            <div class="model-dropdown" id="modelDropdown">
                <!-- 模型选项将通过JavaScript动态添加 -->
            </div>
        </div>
    </div>
    <!-- 连接状态图标与连接状态在同一行 -->
    <div class="status">
        <i class="el-icon-link"></i>
        <span class="status disconnected" id="connectionStatus">连接状态：已断开</span>
    </div>
    <div class="chat-messages" id="chatMessages">
        <!-- 消息将在这里动态添加 -->
    </div>
    <div class="chat-input">
        <div class="input-controls">
            <div class="context-warning" id="contextWarning">
                ⚠ 当前会话上下文过长，可能影响回答的质量，建议新建会话
            </div>
            <div class="mode-buttons">
                <button class="mode-btn" data-mode="deep">

                    </path>
                    </svg>
                    <!-- <img src="imgs/deep_think.png" alt="深度思考" class="mode-icon"> -->
                    深度思考
                </button>
                <button class="mode-btn"  data-mode="web">
                    <svg class="mode-icon mode-icon-dark icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="3864" width="200" height="200"><path d="M519.662933 955.7504h-13.636266c-119.808-1.774933-223.402667-45.6704-308.1728-130.4576-25.668267-25.685333-47.5648-53.0432-65.041067-81.390933l-0.170667-0.290134a112.059733 112.059733 0 0 1-3.8912-6.0416C88.610133 670.890667 68.266667 594.9952 68.266667 512c0-81.646933 19.677867-156.3136 58.5216-221.986133 0.6144-1.570133 1.4336-3.054933 2.474666-4.4544l2.2016-3.771734a445.44 445.44 0 0 1 66.389334-83.950933C282.658133 113.629867 386.218667 70.0416 505.719467 68.266667H519.662933c0.034133-0.068267 0.187733 0 0.3072 0 118.391467 1.774933 221.1328 45.3632 305.339734 129.5872a475.989333 475.989333 0 0 1 66.781866 83.182933l0.170667 0.273067 0.221867 0.3584 2.747733 4.727466C935.389867 353.109333 955.733333 429.0048 955.733333 512c0 82.397867-20.053333 157.696-59.579733 223.7952a125.559467 125.559467 0 0 0-2.901333 5.085867 451.464533 451.464533 0 0 1-68.061867 84.5312c-84.053333 84.6336-186.7776 128.546133-305.186133 130.338133h-0.341334z m-193.194666-204.4416a466.773333 466.773333 0 0 0 26.248533 53.418667c41.198933 71.338667 88.098133 109.397333 143.069867 115.985066v-169.745066l-169.3184 0.341333z m203.451733-0.4096v169.796267c53.316267-6.792533 100.829867-45.7728 141.380267-116.002134a496.0768 496.0768 0 0 0 26.7776-54.152533l-168.157867 0.3584z m205.056-0.426667a538.709333 538.709333 0 0 1-34.0992 71.2704c-19.0464 32.989867-39.7312 59.938133-61.986133 80.810667 60.091733-19.3024 114.3808-53.179733 162.218666-101.341867a431.752533 431.752533 0 0 0 44.6464-51.012266l-110.779733 0.273066z m-555.707733 1.2288a432.469333 432.469333 0 0 0 42.7008 49.4592c48.059733 48.059733 102.673067 81.902933 163.208533 101.239467-22.357333-20.855467-43.0592-47.752533-62.0544-80.64a503.0912 503.0912 0 0 1-33.3824-70.365867l-110.472533 0.3072zM102.7072 529.066667c2.542933 69.085867 20.6336 132.437333 53.879                     </path>
                    </svg>
                    联网搜索
                </button>
                <button class="mode-btn" data-mode="mcp">
                    <i class="el-icon-connection mode-icon" style="font-weight: 800;"></i>
                    MCP
                </button>
                <!-- 添加文件上传容器 -->
                <div class="attachment-container">
                    <div class="file-list" id="fileList"></div>
                    <i class="el-icon-paperclip attachment-trigger" data-tooltip="上传附件(仅识别文字)&#10;支持.txt、.pdf、.xls、xlsx文件，每个最大10M"></i>
                </div>
            </div>
            <textarea id="messageInput" placeholder="输入消息后可按Enter发送，Shift+Enter换行..."></textarea>
        </div>
        <button id="sendButton">
            <svg class="send-icon" viewBox="0 0 24 24">
                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>
            <svg class="stop-icon" viewBox="0 0 24 24" style="display:none;">
                <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
        </button>
    </div>
</div>
<script src="./js/settings.js"></script>
<script src="./js/script.js"></script>
<!-- 引入UI组件库 -->
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</body>
</html>
